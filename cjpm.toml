# 业务包：业务代码的唯一真相（RFC-002 §7.3——骨架永远是外壳，业务只有一份）。
# output-type = "static"：桌面骨架（targets/desktop）与鸿蒙入口（targets/ohos/entry）
# 都以 path 依赖引用本包——同一份业务代码，多个目标各编各的产物。
[package]
  cjc-version = "1.0.5"
  name = "lingqu"
  description = "lingqu - cj-tauri 业务包"
  version = "0.39.156"
  target-dir = ""
  output-type = "static"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  # cj-tauri 框架本体。**不写本机绝对路径**：cjpm 会展开 ${CJ_TAURI_ROOT}
  # （2026-10-30 实测：dependencies.path 与 target.*.link-option 两处都展开），
  # 于是仓里不含任何人的本机路径，换机器只设环境变量即可。
  # test.sh / run-dev.sh 会给出按平台的默认值；setup.sh 会校验它是否存在。
  cjTauri = { path = "${CJ_TAURI_ROOT}" }

# ── 为什么业务包自己要写 link-option ────────────────────────────────────────
# 业务包里引用了 cjTauri 的 FFI 外部函数（cj_bridge_*），而 C 桥的实现只在
# **可执行产物**那一侧链接（targets/desktop/cjpm.toml 由 sync 派生时自带）。
# 但 `cjpm test` 会把本包编成一个独立的测试可执行文件，那条链接行里没有 C 桥，
# 于是 ld.lld 报一串 `undefined symbol: cj_bridge_*`。在业务包这一层补上即可。
#   · 路径同样走 ${CJ_TAURI_ROOT}（与上面的依赖同源，不含本机绝对路径）
#   · 不写 --subsystem=windows：这里只影响测试可执行文件，测试要能往控制台打输出
[target.x86_64-w64-mingw32]
  link-option = "-L${CJ_TAURI_ROOT}/native -lcjtbridge"

[target.x86_64-unknown-linux-gnu]
  link-option = "-L${CJ_TAURI_ROOT}/native -lcjtbridge -lwebkit2gtk-4.1 -lgtk-3 -lgdk-3 -lglib-2.0 -lgio-2.0 -lsoup-3.0 -ljavascriptcoregtk-4.1 -lgobject-2.0"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX}"]

[target.x86_64-w64-mingw32.bin-dependencies]
    path-option = ["${CANGJIE_STDX}"]

[target.aarch64-linux-ohos]
  # 鸿蒙目标：交叉编译工具链与 sysroot 由 DevEco 仓颉套件提供，路径全部走环境变量
  # （与框架根 cjpm.toml 同口径；末尾 --dy-std 不可省，原因见框架根 toml 的鸿蒙段注释）
  compile-option = "-B \"${DEVECO_CANGJIE_HOME}/build-tools/third_party/llvm/bin\" -B \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/clang/15.0.4/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/aarch64-linux-ohos\" --sysroot \"${DEVECO_OH_NATIVE_HOME}/sysroot\" --dy-std"

[target.aarch64-linux-ohos.bin-dependencies]
    # stdx 必须用鸿蒙版（CANGJIE_STDX_OHOS，桌面版 ABI 不通）；CANGJIE_OHOS_LIBS 指 DevEco
    # 套件的 api/lib/linux_ohos_aarch64_cjnative/ohos（仓颉标准库 + ohos API 绑定）
    path-option = ["${CANGJIE_STDX_OHOS}", "${CANGJIE_OHOS_LIBS}", "${AARCH64_MACRO_LIBS}", "${AARCH64_KIT_LIBS}"]
