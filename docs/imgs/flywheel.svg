<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4CA497"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="820" fill="#F8FAFC"/>
  <text x="600" y="50" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#2D3748">AI 自动进化飞轮（灵渠迁移台）</text>

  <!-- ① 迁移现场 -->
  <rect x="60" y="140" width="220" height="80" rx="10" fill="#0891B2"/>
  <text x="170" y="173" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">① 迁移现场</text>
  <text x="170" y="198" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#FFFFFF">cjh 跑 8 步流水线</text>

  <!-- ② 事实层 -->
  <rect x="70" y="314" width="200" height="96" rx="6" fill="#E99151"/>
  <ellipse cx="170" cy="314" rx="100" ry="13" fill="#E99151"/>
  <text x="170" y="352" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">② 事实层（自动）</text>
  <text x="170" y="375" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">.lingqu/&lt;步骤&gt;/&lt;工程&gt;.json</text>
  <text x="170" y="396" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">agent/trace.jsonl · report/*</text>

  <!-- ③ 经验层 -->
  <rect x="70" y="474" width="200" height="96" rx="6" fill="#E99151"/>
  <ellipse cx="170" cy="474" rx="100" ry="13" fill="#E99151"/>
  <text x="170" y="506" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">③ 经验层（agent 自述）</text>
  <text x="170" y="529" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">notes --action append</text>
  <text x="170" y="550" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">→ notes/&lt;工程&gt;.md（四段+次数）</text>

  <!-- ④ 证据层 -->
  <rect x="70" y="634" width="200" height="106" rx="6" fill="#E99151"/>
  <ellipse cx="170" cy="634" rx="100" ry="13" fill="#E99151"/>
  <text x="170" y="666" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">④ 证据层（自动）</text>
  <text x="170" y="689" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">diagnose 未命中 → misses.jsonl</text>
  <text x="170" y="710" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">（归一签名，同形态累加）</text>

  <!-- 人（唯一人工闸门） -->
  <rect x="450" y="170" width="260" height="70" rx="10" fill="#DC2626"/>
  <text x="580" y="199" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">人（唯一人工闸门）</text>
  <text x="580" y="223" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">复核裁决 → 补「- 入库：&lt;引用&gt;」</text>

  <!-- ⑤ 候选池 -->
  <rect x="440" y="330" width="280" height="120" rx="10" fill="#E4C189"/>
  <text x="580" y="358" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#2D3748">⑤ 候选池（机器提议）</text>
  <text x="580" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2D3748">notes --action suggest</text>
  <text x="580" y="402" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2D3748">门槛：次数 ≥2 + 四段齐 + 未入库</text>
  <text x="580" y="423" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2D3748">／同签名未命中 ≥3 次 ＋ PR 草稿</text>

  <!-- archive -->
  <rect x="445" y="510" width="270" height="70" rx="10" fill="#94A3B8"/>
  <text x="580" y="539" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">archive：入库条目移出候选池</text>
  <text x="580" y="562" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">台账 ≥200 行整体归档</text>

  <!-- ⑥ 认知层 -->
  <rect x="840" y="330" width="300" height="120" rx="10" fill="#E99151"/>
  <text x="990" y="360" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">⑥ 认知层（固化）</text>
  <text x="990" y="386" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">指纹库 FP-001… · 规则库 R2-PORT-…</text>
  <text x="990" y="407" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">技能库 skills/t2h-ohos-port/</text>
  <text x="990" y="428" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">AGENTS §4 坑清单</text>

  <!-- ⑦ 回流 -->
  <rect x="845" y="510" width="290" height="90" rx="10" fill="#4CA497"/>
  <text x="990" y="539" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">⑦ 回流（下次启动生效）</text>
  <text x="990" y="563" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">t2h:skill 装进 ~/.cjh/skills/</text>
  <text x="990" y="585" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#FFFFFF">（进 system prompt，不热替换）</text>

  <!-- 边：①→② -->
  <line x1="170" y1="220" x2="170" y2="300" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="265" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B">每步落档</text>
  <!-- 边：①→③ -->
  <polyline points="280,170 330,170 330,522 274,522" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="300" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B">撞坑：报错 / 重试 ≥2 / 换方案</text>
  <!-- 边：①→④ 虚线 -->
  <polyline points="280,205 360,205 360,687 274,687" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="368" y="620" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B">不认识就攒</text>
  <!-- 边：③→⑤ -->
  <polyline points="270,522 330,522 330,440 436,440" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 边：④→⑤ -->
  <polyline points="270,687 380,687 380,462 436,462" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 边：人→⑤ -->
  <line x1="580" y1="240" x2="580" y2="326" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="592" y="290" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#DC2626">裁决</text>
  <!-- 边：⑤→⑥ -->
  <line x1="720" y1="390" x2="836" y2="390" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="742" y="380" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B">确认入库</text>
  <!-- 边：⑤→archive -->
  <line x1="580" y1="450" x2="580" y2="506" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 边：⑥→⑦ -->
  <line x1="990" y1="450" x2="990" y2="506" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 回边：⑦→① -->
  <polyline points="990,600 990,770 30,770 30,180 56,180" fill="none" stroke="#4CA497" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrow-green)"/>
  <text x="500" y="758" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#4CA497">下一轮：同一个 agent，但「知道得更多」</text>
</svg>
